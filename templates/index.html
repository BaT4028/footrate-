
{% extends "base.html" %}
{% block title %}FootRate{% endblock %}

{% block content %}
<style>
  body {
    margin: 0;
  }

  .fr-app {
    position: fixed;
    inset: 0;
    background: #080808;
    color: white;
    overflow: hidden;
    font-family: Arial, sans-serif;
  }

  .fr-feed {
    width: 100%;
    height: 100%;
    position: relative;
    display: flex;
    justify-content: center;
    align-items: center;
  }

  .fr-slide {
    display: none;
    width: 100%;
    height: 100%;
    align-items: center;
    justify-content: center;
  }

  .fr-slide.active {
    display: flex;
  }

  .fr-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
    cursor: zoom-in;
  }

  .fr-empty {
    padding: 24px;
    text-align: center;
    color: #aaa;
  }

  .fr-upload {
    position: fixed;
    z-index: 20;
    bottom: max(22px, env(safe-area-inset-bottom));
    left: 50%;
    transform: translateX(-50%);
    width: 58px;
    height: 58px;
    border: none;
    border-radius: 50%;
    background: #fff;
    color: #111;
    font-size: 38px;
    line-height: 1;
    cursor: pointer;
    box-shadow: 0 4px 22px #0008;
  }

  .fr-upload:active {
    transform: translateX(-50%) scale(.94);
  }

  .fr-file {
    display: none;
  }

  .fr-lightbox {
    position: fixed;
    z-index: 40;
    inset: 0;
    background: #000f;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
  }

  .fr-lightbox[hidden] {
    display: none;
  }

  .fr-lightbox img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .fr-close {
    position: absolute;
    top: 18px;
    right: 18px;
    border: none;
    border-radius: 50%;
    padding: 12px;
    background: #222;
    color: white;
    font-size: 20px;
  }
</style>

<div class="fr-app">
  <div class="fr-feed" id="frFeed">
    {% if photos %}
      {% for photo in photos %}
        <div class="fr-slide {% if loop.first %}active{% endif %}">
          <img
            class="fr-image"
            src="{{ photo['image_url'] }}"
            alt="Feltöltött kép"
            draggable="false"
            loading="{% if loop.first %}eager{% else %}lazy{% endif %}"
          >
        </div>
      {% endfor %}
    {% else %}
      <div class="fr-empty">
        Még nincs kép.
      </div>
    {% endif %}
  </div>

  <form id="frUploadForm"
        method="post"
        action="{{ url_for('upload') }}"
        enctype="multipart/form-data">

    <input type="hidden" name="csrf_token"
           value="{{ csrf_token() }}">

    <input
      class="fr-file"
      id="frFile"
      type="file"
      name="photo"
      accept=".jpg,.jpeg,.png,.webp,image/jpeg,image/png,image/webp"
      required
    >

    <button class="fr-upload" type="button"
            id="frUploadButton" aria-label="Kép feltöltése">+</button>
  </form>
</div>

<div class="fr-lightbox" id="frLightbox" hidden>
  <button class="fr-close" id="frClose" type="button">✕</button>
  <img id="frZoomImage" src="" alt="Nagyított kép">
</div>

<script>
(() => {
  const slides = [...document.querySelectorAll(".fr-slide")];
  let current = 0;

  function show(index) {
    if (!slides.length) return;

    current = Math.max(0, Math.min(index, slides.length - 1));

    slides.forEach((slide, i) => {
      slide.classList.toggle("active", i === current);
    });
  }

  let startX = 0;
  let startY = 0;

  const feed = document.getElementById("frFeed");

  feed.addEventListener("touchstart", event => {
    if (event.touches.length !== 1) return;
    startX = event.touches[0].clientX;
    startY = event.touches[0].clientY;
  }, { passive: true });

  feed.addEventListener("touchend", event => {
    if (event.changedTouches.length !== 1) return;

    const dx = event.changedTouches[0].clientX - startX;
    const dy = event.changedTouches[0].clientY - startY;

    if (Math.abs(dx) < 45 || Math.abs(dx) < Math.abs(dy)) return;

    show(current + (dx < 0 ? 1 : -1));
  }, { passive: true });

  document.addEventListener("keydown", event => {
    const zoom = document.getElementById("frLightbox");
    if (!zoom.hidden) return;

    if (event.key === "ArrowRight") show(current + 1);
    if (event.key === "ArrowLeft") show(current - 1);
  });

  const fileInput = document.getElementById("frFile");
  const uploadButton = document.getElementById("frUploadButton");
  const uploadForm = document.getElementById("frUploadForm");

  uploadButton.addEventListener("click", () => fileInput.click());

  fileInput.addEventListener("change", () => {
    if (fileInput.files.length) uploadForm.requestSubmit();
  });

  const lightbox = document.getElementById("frLightbox");
  const zoomImage = document.getElementById("frZoomImage");

  document.querySelectorAll(".fr-image").forEach(img => {
    img.addEventListener("click", () => {
      zoomImage.src = img.src;
      lightbox.hidden = false;
    });
  });

  function closeZoom() {
    lightbox.hidden = true;
    zoomImage.src = "";
  }

  document.getElementById("frClose").addEventListener("click", closeZoom);

  lightbox.addEventListener("click", event => {
    if (event.target === lightbox) closeZoom();
  });

  document.addEventListener("keydown", event => {
    if (event.key === "Escape") closeZoom();
  });
})();
</script>
{% endblock %}
